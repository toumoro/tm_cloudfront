services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Toumoro\TmCloudfront\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Cache/Backend/*'
      - '../Classes/Task/*'

  # Instantiated with GeneralUtility::makeInstance() (hook, cache backend, scheduler task)
  Toumoro\TmCloudfront\Hooks\ClearCachePostProc:
    public: true
  Toumoro\TmCloudfront\Cache\CloudFrontCacheManager:
    public: true
  Toumoro\TmCloudfront\Service\InvalidationDispatcher:
    public: true
  Toumoro\TmCloudfront\Configuration\CloudFrontConfiguration:
    public: true
  Toumoro\TmCloudfront\Middleware\CacheTagHeaderMiddleware:
    public: true
